<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100b25">
<meta name="description" content="A strange little midnight ride through the Wolfes woods.">
<title>Wolfes Woods — a little trip</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{--ink:#fff9d8;--acid:#d5ff39;--pink:#ff57bd;--sky:#a7eaff;--night:#100b25}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--night);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif}button{font:inherit;color:inherit}#world{position:fixed;inset:0;width:100%;height:100%;display:block;background:radial-gradient(ellipse at 50% 23%,#35214f 0,#18132f 38%,#080d1a 100%)}
body:after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.14;z-index:3;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.36'/%3E%3C/svg%3E");mix-blend-mode:soft-light}
.vignette{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(3,5,15,.22) 75%,rgba(3,5,15,.72) 130%)}
.topbar{position:fixed;z-index:5;top:0;left:0;right:0;padding:max(20px,env(safe-area-inset-top)) clamp(18px,4vw,54px) 0;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.brand,.pill{pointer-events:auto}.brand{font:500 10px 'DM Mono',monospace;letter-spacing:.22em;text-transform:uppercase;color:#fffbd6a8}.brand b{color:var(--acid);font-weight:500}.pill{border:1px solid #fff9d344;border-radius:99px;background:#100b2559;padding:9px 13px;font:10px 'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase;backdrop-filter:blur(12px)}
.landing{position:fixed;z-index:4;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:88px 22px 70px;transition:opacity .9s,transform 1s;pointer-events:none}.landing>*{pointer-events:auto}.copy{max-width:760px}.eyebrow{font:11px 'DM Mono',monospace;letter-spacing:.28em;text-transform:uppercase;color:var(--acid);margin-bottom:21px;text-shadow:0 0 18px #d5ff3966}.title{font-size:clamp(58px,13.2vw,152px);line-height:.76;letter-spacing:-.095em;font-weight:600;margin:0 0 26px;text-shadow:0 4px 50px #ec45d855;transform:rotate(-3deg)}.title span{display:block;color:var(--pink);font-style:italic;letter-spacing:-.11em;margin-left:.46em;text-shadow:0 0 28px #ff57bd80}.sub{max-width:360px;margin:0 auto 31px;font-size:14px;line-height:1.65;color:#fff9d9bf}.go{position:relative;border:0;border-radius:5px;background:var(--acid);color:#19182a;padding:18px 23px;min-width:230px;font-weight:700;font-size:13px;letter-spacing:.03em;cursor:pointer;transform:rotate(1deg);box-shadow:0 0 0 1px #efffa44d,0 12px 60px #d5ff3940;transition:transform .2s,box-shadow .2s}.go:hover,.go:focus-visible{transform:rotate(-1deg) scale(1.04);box-shadow:0 0 0 4px #d5ff3944,0 12px 75px #d5ff3970;outline:none}.go em{font-style:normal;margin-left:8px;font-size:19px;vertical-align:-2px}.tiny{font:9px 'DM Mono',monospace;letter-spacing:.12em;color:#fff9d972;text-transform:uppercase;margin-top:18px}.landing.gone{opacity:0;transform:scale(1.2);pointer-events:none}.hud{position:fixed;z-index:4;inset:auto 0 0;display:flex;align-items:end;justify-content:space-between;padding:0 clamp(18px,4vw,54px) max(22px,env(safe-area-inset-bottom));opacity:0;transition:opacity .6s;pointer-events:none}.hud.on{opacity:1}.hud>*{pointer-events:auto}.caption{font:10px 'DM Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#fff9d9a6}.hud-actions{display:flex;gap:8px}.hud button{background:#100b2566;border:1px solid #fff9d344;border-radius:99px;padding:11px 14px;backdrop-filter:blur(12px);font:10px 'DM Mono',monospace;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}.hud button:active{transform:scale(.96)}.flash{position:fixed;inset:0;background:#fff6c7;z-index:6;opacity:0;pointer-events:none}.flash.pop{animation:flash .65s ease-out}@keyframes flash{0%{opacity:.8}100%{opacity:0}}
@media(max-width:600px){.title{font-size:clamp(56px,17vw,105px)}.eyebrow{font-size:9px}.sub{font-size:13px;max-width:290px}.go{width:min(100%,310px);min-height:58px}.hud{align-items:end}.caption{max-width:100px;line-height:1.5}.hud-actions{gap:6px}.hud button{padding:10px 11px;font-size:9px}.topbar{padding-top:max(15px,env(safe-area-inset-top))}}

</style>
</head>
<body>
<canvas id="world" aria-label="An animated, surreal forest ride"></canvas><div class="vignette"></div>
<div class="topbar"><div class="brand">A <b>WOLFES</b> WOODS PRODUCTION</div><div class="pill" id="status">THE WOODS ARE LISTENING</div></div>
<main class="landing" id="landing"><div class="copy"><div class="eyebrow">/// A short trip somewhere else ///</div><h1 class="title">WOLFES<span>WOODS</span></h1><p class="sub">The path is a little crooked. The trees know your name. It’s probably fine.</p><button class="go" id="enter">Click here, Wolfes <em>↗</em></button><div class="tiny">Best taken full screen · volume optional · no map</div></div></main>
<div class="hud" id="hud"><div class="caption" id="caption">KEEP YOUR EYES OPEN</div><div class="hud-actions"><button id="sound">♫ Sound off</button><button id="again">↺ Again</button></div></div><div class="flash" id="flash"></div>
<script>
(()=>{
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d',{alpha:false});let w,h,dpr,t=0,ride=false,finished=false,start=0,soundOn=false,audio=null,raf,musicTimer=null,musicNodes=[];const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand=(a,b)=>a+Math.random()*(b-a),lerp=(a,b,x)=>a+(b-a)*x,clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
let stars=Array.from({length:95},()=>({x:Math.random(),y:Math.random()*.56,r:rand(.5,2),p:rand(0,6)})), fireflies=Array.from({length:60},()=>({x:Math.random(),y:Math.random(),p:rand(0,8),r:rand(1,3)}));
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const palette=['#a2ff48','#f954cb','#53e4e7','#ffb33d','#9b82ff','#ff697a'];
function draw(now){t=now/1000;const elapsed=ride?(now-start)/1000:0,progress=ride?clamp(elapsed/45,0,1):0;let speed=ride?(1+progress*3.8):.25;if(reduced)speed*=.28;let sway=Math.sin(t*.55)*.1+Math.sin(t*.17)*.14;let hueShift=(Math.sin(t*.18)+1)*35;
let g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,`hsl(${255+hueShift},42%,${ride?lerp(17,28,Math.sin(t*.22)*.5+.5):14}%)`);g.addColorStop(.57,'#171632');g.addColorStop(1,'#090c18');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
// moon / impossible sun
let mx=w*(.5+sway*.32),my=h*.24,moonR=Math.min(w,h)*(.105+Math.sin(t*.3)*.009);ctx.save();ctx.shadowBlur=45;ctx.shadowColor='#ffc8fa';let mg=ctx.createRadialGradient(mx-moonR*.3,my-moonR*.35,1,mx,my,moonR);mg.addColorStop(0,'#fffde4');mg.addColorStop(.65,'#ffb9e9');mg.addColorStop(1,'#b590f2');ctx.fillStyle=mg;ctx.beginPath();ctx.arc(mx,my,moonR,0,Math.PI*2);ctx.fill();ctx.restore();
// stars
for(const s of stars){let xx=(s.x*w + Math.sin(t*.2+s.p)*6 + w)%w, tw=.35+.65*Math.sin(t*1.4+s.p)**2;ctx.globalAlpha=tw*(ride?.8:.55);ctx.fillStyle='#fff6dc';ctx.beginPath();ctx.arc(xx,s.y*h,s.r*tw,0,7);ctx.fill()}ctx.globalAlpha=1;
// distant rolling hills
for(let layer=0;layer<3;layer++){let y=h*(.49+layer*.07),amp=h*(.025+layer*.017),offset=t*speed*(layer+1)*7;ctx.beginPath();ctx.moveTo(0,h);for(let x=0;x<=w+12;x+=12){let z=x/w;let yy=y+Math.sin(z*8+offset+layer)*amp+Math.sin(z*17-offset*.6)*amp*.38;ctx.lineTo(x,yy)}ctx.lineTo(w,h);ctx.closePath();ctx.fillStyle=['#272147','#171a30','#101827'][layer];ctx.fill()}
// path / tunnel perspective
let vanX=w*(.5+sway*.25),vanY=h*.48;ctx.save();ctx.translate(vanX,vanY);ctx.rotate(sway*.11);ctx.beginPath();ctx.moveTo(-w*.038,0);ctx.bezierCurveTo(-w*.18,h*.19,-w*.12,h*.56,-w*.8,h);ctx.lineTo(w*.8,h);ctx.bezierCurveTo(w*.12,h*.56,w*.18,h*.19,w*.038,0);ctx.closePath();let pg=ctx.createLinearGradient(0,0,0,h);pg.addColorStop(0,'#a14cba22');pg.addColorStop(.5,'#ff48bc18');pg.addColorStop(1,'#ffb42c55');ctx.fillStyle=pg;ctx.fill();ctx.restore();
// trees on both sides: trunks, branches, luminous canopy discs. Motion moves toward edges.
let count=ride?19:12;for(let i=0;i<count;i++){let z=((i/count+(t*speed*.10)%1)%1),depth=z*z;for(let side of [-1,1]){let baseX=vanX+side*(w*(.075+depth*.88))+Math.sin(t*.7+i+side)*w*.018,baseY=vanY+(h*.58*depth),height=h*(.08+.69*depth),thick=(1+depth*20)*Math.min(1,w/450);let topX=baseX-side*height*(.18+Math.sin(i*5)*.09);ctx.strokeStyle=`hsla(${(128+i*11+hueShift)%360},${50+depth*30}%,${12+depth*14}%,${.65+depth*.3})`;ctx.lineWidth=thick;ctx.beginPath();ctx.moveTo(baseX,baseY);ctx.quadraticCurveTo(baseX-side*height*.1,baseY-height*.48,topX,baseY-height);ctx.stroke();for(let b=0;b<4;b++){let by=baseY-height*(.26+b*.15),bx=lerp(baseX,topX,.36+b*.13);ctx.beginPath();ctx.moveTo(bx,by);ctx.quadraticCurveTo(bx-side*height*.13,by-height*.06,bx-side*height*.22,by-height*(.08+depth*.02));ctx.stroke()}
let crownR=(8+depth*62)*Math.min(1,w/500);ctx.globalAlpha=.35+depth*.55;for(let c=0;c<5;c++){let cx=topX+randSeed(i*9+c)*crownR*1.3,cy=baseY-height+randSeed(i*3+c+12)*crownR*.9;ctx.fillStyle=palette[(i+c)%palette.length];ctx.shadowBlur=depth*19;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.ellipse(cx,cy,crownR*(.55+randSeed(i+c)*.4),crownR*(.45+randSeed(i+c+6)*.45),randSeed(c+i)*2,0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0;ctx.globalAlpha=1}}
// fireflies
for(let i=0;i<fireflies.length;i++){let f=fireflies[i],phase=t*1.6+f.p,warp=ride?Math.sin(t*.9+f.p)*.12:0,x=((f.x+Math.sin(phase)*.018+warp+1)%1)*w,y=(.28+f.y*.62+Math.sin(phase*.7)*.018)*h,alpha=.15+.8*(Math.sin(phase)**2);ctx.globalAlpha=alpha;ctx.fillStyle=i%4===0?'#ff73da':'#d7ff72';ctx.shadowBlur=12;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.arc(x,y,f.r*(.55+alpha),0,7);ctx.fill()}ctx.shadowBlur=0;ctx.globalAlpha=1;
if(ride){let captions=['BALLOON FOX, ENGAGE','THE FERNS HAVE A TELEPHONE','A LAMP IS WEARING A HAT','PLEASE MIND THE FLYING SOUP','THE FOREST HAS CHANGED SOCKS','THE MOON IS A SOUP','DESTINY IS APPROACHING'];let ix=Math.min(captions.length-1,Math.floor(elapsed/6.4));document.getElementById('caption').textContent=elapsed>=39?'THE BLUE WOLF KNOWS':'// '+captions[ix];if(elapsed>=45){ride=false;document.getElementById('status').textContent='DESTINY, APPARENTLY';document.getElementById('caption').textContent='FOLLOW YOUR DESTINY';document.getElementById('again').textContent='↺ Again';finished=true}}
if(ride && elapsed>=0 && elapsed<45){doodle(w*.5,h*.57,Math.min(w,h)/300,now)}else if(finished){drawWolf(w*.5,h*.54,Math.min(w,h)/300,45)}
// chromatic journey veil; keeps contrast while bending the edges
if(ride){let a=.07+Math.sin(t*1.1)*.035+progress*.05;ctx.fillStyle=`hsla(${(t*20)%360},90%,60%,${a})`;ctx.fillRect(0,0,w,h);let r=Math.min(w,h)*(.25+Math.sin(t*.7)*.05);let vg=ctx.createRadialGradient(w/2,h/2,r,w/2,h/2,Math.max(w,h)*.8);vg.addColorStop(0,'transparent');vg.addColorStop(1,`hsla(${(t*18+40)%360},80%,35%,.36)`);ctx.fillStyle=vg;ctx.fillRect(0,0,w,h)}
raf=requestAnimationFrame(draw)}
function randSeed(n){let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}raf=requestAnimationFrame(draw);
function doodle(x,y,scale,now){
 const elapsed=ride?(now-start)/1000:0, finale=ride&&elapsed>=39;
 if(finale){drawWolf(x,y,scale,elapsed);return}
 const bits=[['🎈','🦊','🚲'],['💡','🎩','🪱'],['🦷','🛼','🌙'],['🐟','☂️','📞'],['🍄','🕶️','🪿'],['🧦','🪐','🫖'],['🐌','🚀','🥨'],['🦆','🎸','🪞'],['🧀','👑','🐍']];
 let i=ride?Math.min(bits.length-1,Math.floor(elapsed/4.35)):0, phase=ride?(elapsed%4.35)/4.35:.5, bob=Math.sin(t*2.8)*.035;
 ctx.save();ctx.translate(x,y+Math.sin(t*1.7+i)*h*.018);ctx.rotate(Math.sin(t*.8+i)*.055);ctx.textAlign='center';ctx.textBaseline='middle';
 const word=['IT KNOWS YOUR POSTCODE','THE MOON IS A SOUP','HONK IF YOU ARE A CLOUD','A SMALL HORSE HAS THE KEYS','PLEASE RETURN THE SKY','THE FERN HAS A LAW DEGREE','BICYCLE OF THE MIND','SOMEONE MOVED TUESDAY','THE FOX IS ON THE PHONE'][i];
 // Cartoon sticker orbit, intentionally assembled from incompatible things.
 ctx.font=`${Math.floor(Math.min(w,h)*(.14+bob))}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`;
 const row=bits[i]; for(let j=0;j<row.length;j++){let xx=(j-1)*Math.min(w,h)*.20, yy=Math.sin(t*2+j*2+i)*Math.min(w,h)*.055;ctx.save();ctx.translate(xx,yy);ctx.rotate(Math.sin(t*1.4+j)*.24);ctx.shadowBlur=24;ctx.shadowColor=palette[(i+j)%palette.length];ctx.fillText(row[j],0,0);ctx.restore()}
 ctx.font=`bold ${Math.max(11,Math.floor(Math.min(w,h)*.022))}px "DM Mono",monospace`;ctx.fillStyle=['#dbff68','#ff88d7','#a5eeff'][i%3];ctx.shadowBlur=18;ctx.shadowColor=ctx.fillStyle;ctx.fillText(word,0,Math.min(w,h)*.19);ctx.restore();
 // Dashed orbit / sprocket rings
 ctx.save();ctx.translate(x,y);ctx.rotate(t*(.18+i*.02));ctx.strokeStyle='rgba(217,255,94,.30)';ctx.lineWidth=1;ctx.setLineDash([4,9]);ctx.beginPath();ctx.ellipse(0,0,Math.min(w,h)*(.23+phase*.05),Math.min(w,h)*.12,0,0,Math.PI*2);ctx.stroke();ctx.restore();
}
function drawWolf(x,y,scale,elapsed){
 const pulse=1+Math.sin(t*3)*.025;ctx.save();ctx.translate(x,y);ctx.scale(scale*pulse,scale*pulse);ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle='#50caff';ctx.shadowColor='#35bfff';ctx.shadowBlur=24;ctx.lineWidth=3.4;
 // Single luminous, hand-drawn wolf profile in electric blue line art.
 ctx.beginPath();ctx.moveTo(-100,42);ctx.lineTo(-118,-36);ctx.lineTo(-64,-12);ctx.lineTo(-40,-78);ctx.lineTo(2,-42);ctx.lineTo(58,-52);ctx.lineTo(92,-18);ctx.lineTo(128,-10);ctx.lineTo(98,18);ctx.lineTo(112,52);ctx.lineTo(68,42);ctx.lineTo(36,74);ctx.lineTo(-6,64);ctx.lineTo(-42,84);ctx.lineTo(-54,49);ctx.closePath();ctx.stroke();
 ctx.beginPath();ctx.moveTo(-39,-28);ctx.quadraticCurveTo(-10,-7,17,-10);ctx.lineTo(49,-26);ctx.moveTo(19,-9);ctx.lineTo(30,1);ctx.lineTo(43,-8);ctx.moveTo(66,8);ctx.lineTo(81,3);ctx.moveTo(-81,3);ctx.lineTo(-63,13);ctx.moveTo(-19,60);ctx.lineTo(-8,47);ctx.moveTo(23,58);ctx.lineTo(20,43);ctx.stroke();ctx.fillStyle='#baf2ff';ctx.beginPath();ctx.arc(54,-11,3,0,Math.PI*2);ctx.fill();ctx.restore();
 ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`700 ${Math.max(20,Math.min(w,h)*.055)}px "Space Grotesk",sans-serif`;ctx.fillStyle='#8fe5ff';ctx.shadowColor='#27aaff';ctx.shadowBlur=22;ctx.fillText('FOLLOW YOUR DESTINY',x,y+Math.min(w,h)*.19);ctx.restore();
}
const landing=document.getElementById('landing'),hud=document.getElementById('hud');
document.getElementById('enter').addEventListener('click',()=>{ride=true;finished=false;start=performance.now();landing.classList.add('gone');if(!soundOn)toggleAudio();hud.classList.add('on');document.getElementById('status').textContent='FOLLOW THE GLOW';document.getElementById('again').textContent='↺ Again';document.getElementById('flash').classList.remove('pop');void document.getElementById('flash').offsetWidth;document.getElementById('flash').classList.add('pop');if(document.documentElement.requestFullscreen&&innerWidth>700)document.documentElement.requestFullscreen().catch(()=>{});});
document.getElementById('again').addEventListener('click',()=>{ride=true;finished=false;start=performance.now();document.getElementById('status').textContent='FOLLOW THE GLOW';document.getElementById('flash').classList.remove('pop');void document.getElementById('flash').offsetWidth;document.getElementById('flash').classList.add('pop')});
function startMusic(){audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const master=audio.createGain();master.gain.value=.24;master.connect(audio.destination);audio.master=master;let step=0;const notes=[110,110,164.81,123.47,146.83,110,185,164.81,98,123.47,146.83,110,164.81,138.59,123.47,185];musicTimer=setInterval(()=>{if(!soundOn)return;const now=audio.currentTime;function blip(freq,dur,type,vol,cut=1200){const o=audio.createOscillator(),g=audio.createGain(),f=audio.createBiquadFilter();o.type=type;o.frequency.setValueAtTime(freq,now);if(type==='square')o.frequency.exponentialRampToValueAtTime(freq*1.48,now+dur*.42);f.type='lowpass';f.frequency.value=cut;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(vol,now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+dur);o.connect(f).connect(g).connect(master);o.start(now);o.stop(now+dur+.02);musicNodes.push(o)}
 // Original sequencer: rigid four-on-the-floor pulse, springy bass, clipped robotic chirps.
 if(step%4===0){blip(55,.18,'sine',.20,180);blip(880,.045,'square',.035,2600)}
 blip(notes[step%notes.length],.105,'square',step%4===2?.07:.045,1800);
 if(step%2===1)blip([660,740,990,550,880,1320,620,1100][(step*3)%8],.07,'triangle',.032,3000);
 if(step%16===14)blip(330,.22,'sawtooth',.028,900);step++},180)}
function toggleAudio(){soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'♫ Beeps on':'♫ Sound off';if(soundOn)startMusic();else if(musicTimer){clearInterval(musicTimer);musicTimer=null;if(audio?.master)audio.master.gain.setTargetAtTime(0,audio.currentTime,.08)}}document.getElementById('sound').addEventListener('click',toggleAudio);
})();
</script>
</body></html>
